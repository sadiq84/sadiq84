<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="35%" stop-color="#0b1528"/>
      <stop offset="70%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Wave 2 Gradient (Solid depth) -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Wave 3 Front Gradient -->
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0c4a6e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Text 3D Chrome Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for 3D Text -->
    <filter id="dropShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>

    <!-- Card Clip Path with rounded corners -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="420" rx="20" ry="20"/>
    </clipPath>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-16px); }
      }
      @keyframes waveHorizontal1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveHorizontal2 {
        0% { transform: translateX(0); }
        50% { transform: translateX(50px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes gridSlide {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }

      .floating-bg { animation: floatSlow 8s ease-in-out infinite; }
      .floating-orb { animation: floatFast 6s ease-in-out infinite; }
      .wave-1 { animation: waveHorizontal1 10s ease-in-out infinite; }
      .wave-2 { animation: waveHorizontal2 14s ease-in-out infinite; }
      .pulsing-light { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .badge-glow { animation: badgePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container with Rounded Corners & Outer Border -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1200" height="420" fill="url(#bgGrad)"/>

    <!-- 3D Isometric Grid Overlay -->
    <g opacity="0.12">
      <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1"/>
      <line x1="0" y1="360" x2="1200" y2="360" stroke="#38bdf8" stroke-width="1"/>
      
      <!-- Perspective Diagonal Grid Rays -->
      <line x1="0" y1="420" x2="300" y2="0" stroke="#38bdf8" stroke-width="1"/>
      <line x1="200" y1="420" x2="500" y2="0" stroke="#38bdf8" stroke-width="1"/>
      <line x1="400" y1="420" x2="700" y2="0" stroke="#38bdf8" stroke-width="1"/>
      <line x1="600" y1="420" x2="900" y2="0" stroke="#38bdf8" stroke-width="1"/>
      <line x1="800" y1="420" x2="1100" y2="0" stroke="#38bdf8" stroke-width="1"/>
      <line x1="1000" y1="420" x2="1200" y2="100" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <!-- Glowing Ambient 3D Orbs (Background depth) -->
    <circle cx="1020" cy="120" r="160" fill="#38bdf8" opacity="0.35" filter="url(#neonGlow)" class="pulsing-light"/>
    <circle cx="200" cy="300" r="140" fill="#0369a1" opacity="0.25" filter="url(#neonGlow)"/>
    <circle cx="600" cy="60" r="90" fill="#0ea5e9" opacity="0.2" filter="url(#neonGlow)"/>

    <!-- Geometric DevSecOps Hexagon Nodes (Subtle Tech Accent) -->
    <g opacity="0.25" class="floating-bg" stroke="#7dd3fc" stroke-width="1.5" fill="none">
      <polygon points="1050,70 1080,87 1080,122 1050,140 1020,122 1020,87"/>
      <polygon points="1120,130 1145,145 1145,175 1120,190 1095,175 1095,145"/>
      <polygon points="980,150 1005,165 1005,195 980,210 955,195 955,165"/>
      <line x1="1050" y1="140" x2="1095" y2="160"/>
      <line x1="1020" y1="122" x2="980" y2="150"/>
    </g>

    <!-- Left Tech Nodes (GitOps Tree) -->
    <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" fill="none">
      <circle cx="90" cy="90" r="6" fill="#38bdf8"/>
      <circle cx="160" cy="60" r="4" fill="#38bdf8"/>
      <circle cx="160" cy="120" r="4" fill="#38bdf8"/>
      <circle cx="230" cy="90" r="5" fill="#34d399"/>
      <path d="M96 90 L156 60 M96 90 L156 120 M164 60 L225 90 M164 120 L225 90"/>
    </g>

    <!-- 3D Layered Waves at Bottom (Signature Curvature Effect) -->
    <!-- Wave 1 (Deepest) -->
    <path class="wave-2" fill="url(#waveGrad1)" d="M -60,280 C 240,240 420,380 720,290 C 960,220 1140,320 1280,260 L 1280,440 L -60,440 Z"/>

    <!-- Wave 2 (Middle Layer with Neon Crest) -->
    <path class="wave-1" fill="url(#waveGrad2)" d="M -40,310 C 280,270 480,390 780,310 C 1000,250 1120,340 1260,290 L 1260,440 L -40,440 Z"/>

    <!-- Neon Glow Line following Wave 2 Crest -->
    <path class="wave-1" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" filter="url(#neonGlow)" d="M -40,310 C 280,270 480,390 780,310 C 1000,250 1120,340 1260,290"/>

    <!-- Wave 3 (Foreground Dark Glass Wave) -->
    <path fill="url(#waveGrad3)" d="M -20,345 C 320,310 520,410 840,340 C 1040,290 1160,360 1240,330 L 1240,440 L -20,440 Z"/>
    <path fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4" d="M -20,345 C 320,310 520,410 840,340 C 1040,290 1160,360 1240,330"/>

    <!-- CENTER CONTENT: 3D Typography & Badges -->

    <!-- Top Eyebrow Chip -->
    <g transform="translate(600, 95)">
      <!-- Pill Container -->
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0a1224" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Glowing Status Dot -->
      <circle cx="-165" cy="0" r="5" fill="#34d399" filter="url(#neonGlow)"/>
      <circle cx="-165" cy="0" r="3" fill="#ffffff"/>
      <!-- Monospace Eyebrow Text -->
      <text x="-148" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="2.5">ENTERPRISE CLOUD ARCHITECT</text>
    </g>

    <!-- Main Title: SADIQ (Massive 3D Typography with Emboss Shadow) -->
    <g transform="translate(600, 195)" filter="url(#dropShadow3D)" text-anchor="middle">
      <!-- 3D Extrusion Shadow Layer -->
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Montserrat', sans-serif" font-size="78" font-weight="900" fill="#042f4c" letter-spacing="3">SADIQ</text>
      <!-- Front Shimmering Face -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Montserrat', sans-serif" font-size="78" font-weight="900" fill="url(#textGrad)" letter-spacing="3">SADIQ</text>
    </g>

    <!-- Secondary Title / Role -->
    <g transform="translate(600, 242)" text-anchor="middle">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#f0f9ff" letter-spacing="1.5">
        Senior DevSecOps Engineer <tspan fill="#38bdf8">|</tspan> Cloud Solutions Architect
      </text>
    </g>

    <!-- Pillar Highlights (Cyber Monospace Tags) -->
    <g transform="translate(600, 275)" text-anchor="middle">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12.5" font-weight="500" fill="#94a3b8" letter-spacing="0.8">
        <tspan fill="#38bdf8">◆</tspan> 100+ Workload Migration <tspan fill="#38bdf8">◆</tspan> Multi-Tier Hub-and-Spoke <tspan fill="#38bdf8">◆</tspan> Shift-Left DevSecOps <tspan fill="#38bdf8">◆</tspan> FinOps (-28% Spend)
      </text>
    </g>

    <!-- Bottom Interactive Badge Row (Embedded Inside the Banner) -->
    <g transform="translate(600, 360)">
      <!-- Badge 1: 100+ Migrations -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0a1224" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">
          ☁️ 100+ Azure Workloads
        </text>
      </g>

      <!-- Badge 2: FinOps -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0a1224" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">
          💰 28% FinOps Savings
        </text>
      </g>

      <!-- Badge 3: Zero-Trust IaC -->
      <g transform="translate(105, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0a1224" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">
          🛡️ Zero-Trust Landing Zone
        </text>
      </g>

      <!-- Badge 4: Status -->
      <g transform="translate(320, 0)" class="badge-glow">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#022c22" fill-opacity="0.95" stroke="#34d399" stroke-width="1.5"/>
        <circle cx="-62" cy="0" r="4" fill="#34d399" filter="url(#neonGlow)"/>
        <text x="8" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ecfdf5" letter-spacing="0.5">
          AVAILABLE FOR HIRE
        </text>
      </g>
    </g>

    <!-- Outer Beveled Glowing Border for 3D Card Depth -->
    <rect x="1" y="1" width="1198" height="418" rx="19" ry="19" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
